services:

  db:
    image: postgres:${POSTGRES_VERSION}
    container_name: quetzalmart-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - quetzalmart-network


  odoo:
    image: odoo:${ODOO_VERSION}
    container_name: quetzalmart-odoo
    restart: unless-stopped

    depends_on:
      - db

    ports:
      - "${ODOO_PORT}:8069"

    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons

    networks:
      - quetzalmart-network


volumes:

  postgres-data:
    name: quetzalmart-postgres-data

  odoo-data:
    name: quetzalmart-odoo-data


networks:

  quetzalmart-network:
    name: quetzalmart-network
    driver: bridge